[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ntt-cosim"
version = "0.1.0"
description = "An NTT butterfly pipeline in SystemVerilog, verified with cocotb on Verilator against FHE_Accelerator_Sim's golden NTT"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["fhe-sim @ git+https://github.com/BrendanJamesLynskey/FHE_Accelerator_Sim"]

[project.optional-dependencies]
rtl = ["cocotb==1.9.2"]
test = ["pytest>=8", "hypothesis>=6", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["rtl: needs a simulator (Verilator or Icarus) and cocotb", "nightly: long campaigns"]
